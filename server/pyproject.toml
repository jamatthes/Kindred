[project]
name = "kindred-server"
version = "0.1.0"
description = "Kindred — self-hosted, map-centric trip planner for groups of families (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    # Server-side callers for Google Maps Platform (families: Geocoding). Was dev-only while
    # it only served the test client; a runtime dependency now that the app itself calls out.
    "httpx>=0.27",
    # Avatar re-encoding (families FM-14): EXIF rotation, square crop, WebP renditions, and
    # the metadata strip that is the whole point.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
