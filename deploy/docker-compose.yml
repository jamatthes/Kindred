# Kindred — deployment stack (F-1).
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Three services: `postgres` (volume-backed), `api` (uvicorn), `caddy` (serves the built web
# bundle and reverse-proxies /api and /ws). Config comes from `deploy/.env` — copy
# `deploy/.env.example`. Never commit `.env`. See deploy/README.md for first-run steps.

name: kindred

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kindred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-kindred}
      TZ: ${TZ:-Europe/London}
      # PGDATA points at a *subdirectory* of the bind mount, not the mount point itself.
      # Postgres refuses to start unless its data directory is mode 0700, and it cannot
      # chmod the mount point on a Docker Desktop bind mount. Letting initdb create its own
      # directory inside the mount is the only arrangement that has a chance of working.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Published for host-side development tooling (alembic, pytest). Remove this on a
      # server that does not need it — the api container reaches Postgres over the compose
      # network either way.
      - "${KINDRED_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind-mounted to ../data/postgres (repo root `data/`) so the database is visible in
      # Explorer instead of hidden in Docker's VM disk. Relative to this file, so it follows
      # the checkout.
      #
      # WARNING: Postgres on a Windows/SMB bind mount is unreliable — it needs POSIX
      # permissions, file locking and honest fsync, and a network share provides none of
      # them. See deploy/README.md ("Where the data lives") for the failure modes and how to
      # go back to a named volume. This is a deliberate, owner-requested trade of durability
      # for visibility.
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kindred} -d ${POSTGRES_DB:-kindred}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Crash recovery after an unclean shutdown (machine sleep, Docker killed) can spend
      # minutes in fsync before accepting connections — especially on the Windows bind
      # mount above. Without a grace window the stack refuses to start in exactly the
      # situation where patience would fix it (observed 2026-08-11).
      start_period: 180s

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever DATABASE_URL says in .env. Host-side tools need `localhost` and
      # this container needs the `postgres` service name; deriving it here means one .env
      # serves both and a stale host in .env cannot silently break the container.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-kindred}
    depends_on:
      postgres:
        # Waits for pg_isready, not merely for the container to exist. The app also retries
        # the connection for up to 60s on its own (app/core/migrations.py), so an unhealthy
        # database delays startup rather than crash-looping it.
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      # Uploads (profile pictures, check-in photos) beside the code, same reasoning as the
      # database above. These are ordinary files, so a bind mount suits them far better than
      # it suits Postgres — no permissions or fsync semantics are required.
      - ../data/attachments:${ATTACHMENTS_DIR:-/data/attachments}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous: the first boot runs migrations and the seed before it answers at all.
      start_period: 60s

  caddy:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KINDRED_SITE_ADDRESS: ${KINDRED_SITE_ADDRESS:-:8080}
    depends_on:
      - api
    ports:
      - "${KINDRED_HTTP_PORT:-8080}:8080"
      # Uncomment both when KINDRED_SITE_ADDRESS is a real hostname, so Caddy can serve
      # HTTPS and answer the ACME HTTP-01 challenge.
      # - "80:80"
      # - "443:443"
    volumes:
      # The Caddyfile lives at web/Caddyfile and is COPYed into the image, not bind-mounted.
      # Docker Desktop cannot bind-mount a single file from an SMB/UNC share, so the old
      # `./Caddyfile:/etc/caddy/Caddyfile` mount failed with "not a directory" on any host
      # whose checkout is on a network drive. Editing the proxy now costs a rebuild — which
      # the SPA bundle in this same image already cost.
      #
      # Certificates and OCSP staples survive a recreate; without this Caddy re-requests a
      # certificate on every deploy and will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # `pgdata` and `attachments` are gone — both are now bind mounts under the repo's `data/`
  # directory so they are visible in Explorer.
  #
  # These two stay named on purpose. They hold TLS certificates, OCSP staples and Caddy's
  # own state — regenerable infrastructure, not your data — and putting a certificate store
  # on a network share is a way to break Caddy without gaining anything you would ever open.
  caddy_data:
  caddy_config:
